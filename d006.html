<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio das tags</title>
    <style>
        abbr {
            text-decoration: none;
            cursor: help;
        }
    </style>
</head>
<body>
    <header>
        <h1>Tags em HTML</h1>
    </header>

    <main>
        <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag devera utilizar em cada caso.</p>

        <ul>
            <li><abbr title="Use a tag &lt;p&gt;">Paragrafos</abbr></li>
            <li><abbr title="Use as tags &lt;h1&gt; ate &lt;h6&gt;">Titulos</abbr></li>
            <li><abbr title="Use a tag &lt;img&gt;">Imagens</abbr></li>
            <li><abbr title="Use a tag &lt;abbr&gt;">Abreviacoes</abbr></li>
            <li><abbr title="Use a tag &lt;code&gt;">Codigo-fonte</abbr></li>
            <li><abbr title="Use a tag &lt;ol&gt;">Lista enumerada</abbr></li>
            <li><abbr title="Use a tag &lt;ul&gt;">Lista com demarcadores</abbr></li>
            <li><span title="Use a tag <p>">Parágrafos</span></li>
        </ul>
        

    </main>
</body>
</html>
